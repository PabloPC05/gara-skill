[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gara-workflow"
version = "0.1.0"
description = "Skills y flujo verificable para Gara, Codex y Claude Code"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validation = ["PyYAML>=6"]
dev = ["ruff"]

[project.scripts]
gara-workflow = "gara_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["gara_workflow*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["export", ".build", ".venv", "skills/gara-commit", "plugins/gara-commit", "skills/gara-ui-animation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"skills/*/scripts/*.py" = ["E402"]
