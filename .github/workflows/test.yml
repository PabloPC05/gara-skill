name: Check Gara Skill bundle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontmatter, references and links
        shell: bash
        run: bash scripts/check.sh

      - name: Compile helper scripts
        run: python -m compileall -q skills plugins

      - name: Run Codex commit package tests
        run: python skills/gara-commit/scripts/test_gara_commit.py -v

      - name: Run Claude Code commit plugin tests
        run: python plugins/gara-commit/skills/commit/scripts/test_gara_commit.py -v
