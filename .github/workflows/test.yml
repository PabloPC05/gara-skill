name: Test gara-commit skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: |
          python -m py_compile skills/gara-commit/scripts/gara_commit.py skills/gara-commit/scripts/test_gara_commit.py
          python -m py_compile plugins/gara-commit/skills/commit/scripts/gara_commit.py plugins/gara-commit/skills/commit/scripts/test_gara_commit.py

      - name: Ensure packaged scripts stay synchronized
        run: |
          cmp skills/gara-commit/scripts/gara_commit.py plugins/gara-commit/skills/commit/scripts/gara_commit.py
          cmp skills/gara-commit/scripts/test_gara_commit.py plugins/gara-commit/skills/commit/scripts/test_gara_commit.py

      - name: Run Codex package tests
        run: python skills/gara-commit/scripts/test_gara_commit.py -v

      - name: Run Claude Code plugin tests
        run: python plugins/gara-commit/skills/commit/scripts/test_gara_commit.py -v
